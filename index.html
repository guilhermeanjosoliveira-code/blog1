<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Título Principal</h1>
        <p>Uma explicação breve e charmosa sobre o tema do seu blog.</p>
    </header>

    <main>
        <img src="Gemini_Generated_Image_mf1m1imf1m1imf1m (1).png" alt="Imagem do post" class="post-image">
        
        <section class="content">
            <h2>Subtítulo do Post</h2>
            <p>Aqui você pode escrever detalhadamente sobre o assunto. Use parágrafos bem espaçados para tornar a leitura agradável e fluida para os seus visitantes.</p>
            
            <button id="likeBtn" class="like-button">
                <span class="heart">❤</span> Curtir (<span id="likeCount">0</span>)
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
